# Lyrx on a server (spec 020): Caddy (HTTPS, the only public part) in front of the app.
# Start or update with scripts/deploy.sh. Settings and keys come from .env next to this file.

services:
  lyrx:
    build: .
    env_file: .env
    environment:
      LYRX_ALLOWED_HOSTS: ${LYRX_DOMAIN:?set LYRX_DOMAIN in .env}
      # Only Caddy (its fixed address below) may name the client in X-Forwarded-For.
      LYRX_TRUSTED_PROXY: 172.30.0.10
    volumes:
      - lyrx-data:/data
    networks:
      - private
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    environment:
      LYRX_DOMAIN: ${LYRX_DOMAIN:?set LYRX_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      private:
        ipv4_address: 172.30.0.10
    depends_on:
      lyrx:
        condition: service_healthy
    restart: unless-stopped

networks:
  private:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  lyrx-data:
  caddy-data:
  caddy-config:

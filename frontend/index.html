<!doctype html>
<!-- The page shell that loads the Subbed app, with its icons and the preview shown for shared links. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subbed · Read Japanese songs line by line</title>
    <meta
      name="description"
      content="Read any Japanese song line by line: the original, hiragana, romaji, and English, side by side, in time with the music."
    />
    <meta name="theme-color" content="#0e0d12" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Subbed" />
    <meta
      property="og:description"
      content="Read any Japanese song line by line: original, hiragana, romaji, and English."
    />
    <!-- ponytail: a relative image path; spec 020 makes it absolute once the domain is known. -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[project]
name = "lyrx-backend"
version = "0.1.0"
description = "Lyrx Prototype 1 API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.115",
    "mutagen>=1.48.1",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# uv project for the Lyrx server: dependencies and ruff, mypy, pytest settings.
[project]
name = "lyrx"
version = "0.1.0"
description = "Local server that turns Japanese lyrics into four versions."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.9.0",
    "fastapi>=0.163.1",
    "fugashi>=1.5.2",
    "httpx2==2.16.2",
    "unidic-lite>=1.0.8",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C4", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# fugashi ships no type hints; japanese_analyzer.py is its only importer.
[[tool.mypy.overrides]]
module = ["fugashi"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

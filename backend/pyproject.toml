[project]
name = "lyrx-backend"
version = "0.1.0"
description = "Lyrx Prototype 1 API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.32",
]

[dependency-groups]
authoring = [
    "langchain>=1.4.8",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.uv]
default-groups = ["dev", "authoring"]
# cryptography 49+ ships no Intel macOS wheels and would need a Rust toolchain to build.
constraint-dependencies = ["cryptography<49"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

STRUCTS:
  ChatRequest_tool_choice:
    - name: value
      TYPE: ANY
      REQUIRED: false
  ChatRequest:
    - name: model
      TYPE: STRING
      REQUIRED: true
    - name: messages
      TYPE: "[]ANY"
      REQUIRED: true
    - name: temperature
      TYPE: FLOAT
      REQUIRED: false
      MINIMUM: 0
      MAXIMUM: 2
    - name: max_completion_tokens
      TYPE: INT
      REQUIRED: false
    - name: stream
      TYPE: BOOL
      REQUIRED: false
    - name: tools
      TYPE: "[]ANY"
      REQUIRED: false
    - name: tool_choice
      TYPE: STRUCT(ChatRequest_tool_choice)
      REQUIRED: false
    - name: response_format
      TYPE: map[STRING]ANY
      REQUIRED: false
    - name: documents
      TYPE: "[]ANY"
      REQUIRED: false
    - name: search_settings
      TYPE: map[STRING]ANY
      REQUIRED: false
    - name: reasoning_format
      TYPE: STRING
      REQUIRED: false
    - name: service_tier
      TYPE: STRING
      REQUIRED: false
  ResponseRequest_input:
    - name: value
      TYPE: ANY
      REQUIRED: false
  ResponseRequest:
    - name: model
      TYPE: STRING
      REQUIRED: true
    - name: input
      TYPE: STRUCT(ResponseRequest_input)
      REQUIRED: true
    - name: instructions
      TYPE: STRING
      REQUIRED: false
    - name: previous_response_id
      TYPE: STRING
      REQUIRED: false
    - name: tools
      TYPE: "[]ANY"
      REQUIRED: false
    - name: stream
      TYPE: BOOL
      REQUIRED: false
  Model:
    - name: id
      TYPE: STRING
      REQUIRED: false
    - name: object
      TYPE: STRING
      REQUIRED: false
    - name: created
      TYPE: INT
      REQUIRED: false
    - name: owned_by
      TYPE: STRING
      REQUIRED: false
    - name: active
      TYPE: BOOL
      REQUIRED: false
    - name: context_window
      TYPE: INT
      REQUIRED: false
    - name: max_completion_tokens
      TYPE: INT
      REQUIRED: false
  BatchRequest:
